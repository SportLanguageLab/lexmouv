<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexMouv — Base de données linguistique</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:#f5f6f8;color:#222;font-size:15px}
header{background:#1a2e4a;color:#fff;padding:16px 32px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header .title h1{font-size:1.4rem;font-weight:700;letter-spacing:.5px}
header .title p{font-size:.82rem;opacity:.7;margin-top:3px}
header .header-btns{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;transition:background .2s}
.hbtn:hover{background:rgba(255,255,255,.28)}
.container{max-width:1300px;margin:0 auto;padding:22px 18px}
.search-panel{background:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:18px}
.search-panel h2{font-size:.8rem;font-weight:700;color:#1a2e4a;margin-bottom:12px;text-transform:uppercase;letter-spacing:.6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.fg label{font-size:.73rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select{border:1px solid #dde;border-radius:6px;padding:8px 10px;font-size:.88rem;outline:none;background:#fafbfc;transition:border .2s}
.fg input:focus,.fg select:focus{border-color:#1a2e4a}
.fg input.main{font-size:.95rem;padding:9px 13px}
.btn-reset{background:#e8edf3;color:#1a2e4a;border:none;border-radius:6px;padding:9px 16px;font-size:.82rem;cursor:pointer;font-weight:700;align-self:flex-end;white-space:nowrap;transition:background .2s}
.btn-reset:hover{background:#d0dae8}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.results-header span{font-size:.83rem;color:#666}
.pager{display:flex;gap:5px;align-items:center}
.pager button{background:#fff;border:1px solid #dde;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:.8rem;color:#1a2e4a;transition:background .2s}
.pager button:hover:not(:disabled){background:#e8edf3}
.pager button:disabled{opacity:.35;cursor:default}
.pager .pi{font-size:.8rem;color:#666;padding:0 4px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
thead{background:#1a2e4a;color:#fff}
thead th{padding:10px 13px;font-size:.76rem;text-align:left;text-transform:uppercase;letter-spacing:.5px;font-weight:700;white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f1f4;cursor:pointer;transition:background .15s}
tbody tr:hover{background:#eef2f7}
tbody tr:last-child{border-bottom:none}
td{padding:9px 13px;font-size:.86rem;vertical-align:middle}
td.tid{color:#999;font-size:.76rem;font-family:monospace}
td.forme{font-weight:600;color:#1a2e4a}
/* BADGES */
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.72rem;font-weight:700;margin:1px;cursor:help;position:relative}
.badge-lang{background:#e8f0fe;color:#1a56b0}
.badge-pos{background:#fef3c7;color:#78350f}
.badge-sem{background:#d1fae5;color:#065f46}
.badge-segsem{background:#e0f2fe;color:#0c4a6e}
.badge-segsyn{background:#fce7f3;color:#9d174d}
.badge-statut{background:#f3e8ff;color:#5b21b6}
.badge-niveau{background:#fee2e2;color:#991b1b}
/* TOOLTIP */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1a2e4a;color:#fff;font-size:.72rem;font-weight:400;padding:5px 9px;border-radius:5px;white-space:pre-wrap;max-width:260px;z-index:999;pointer-events:none;line-height:1.4;text-align:left;min-width:120px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
[data-tip]:hover::before{content:"";position:absolute;bottom:calc(100% + 1px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1a2e4a;z-index:999;pointer-events:none}
/* MODAL GENERIC */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(860px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.22)}
.mh{background:#1a2e4a;color:#fff;padding:16px 22px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
.mh h2{font-size:1.2rem;font-weight:700}
.mh .mmeta{font-size:.8rem;opacity:.75;margin-top:3px}
.mcl{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;opacity:.8;padding:0 4px}
.mcl:hover{opacity:1}
.mb{padding:20px 22px}
.sec{margin-bottom:20px}
.sec h3{font-size:.77rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#1a2e4a;margin-bottom:9px;padding-bottom:5px;border-bottom:2px solid #e8edf3}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.ii{background:#f8f9fc;border-radius:6px;padding:9px 11px}
.ii .lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;color:#999;margin-bottom:2px}
.ii .val{font-size:.88rem;color:#222;font-weight:500}
.seg-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.seg-tbl th{background:#f0f4f8;padding:7px 10px;text-align:left;font-size:.7rem;font-weight:700;text-transform:uppercase;color:#666;white-space:nowrap}
.seg-tbl td{padding:7px 10px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
.seg-tbl tr:last-child td{border-bottom:none}
.snum{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#1a2e4a;color:#fff;border-radius:50%;font-size:.7rem;font-weight:700;margin-right:6px;flex-shrink:0}
.sf{font-weight:700;color:#1a2e4a}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.empty{text-align:center;padding:40px;color:#bbb;font-style:italic}
/* LÉGENDE PANEL */
.leg-overlay{display:none;position:fixed;inset:0;z-index:1000;pointer-events:none}
.leg-overlay.open{display:block;pointer-events:auto}
.leg-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.leg-panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,95vw);background:#fff;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.leg-header{background:#1a2e4a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.leg-header h2{font-size:1rem;font-weight:700}
.leg-body{padding:16px 18px;flex:1}
.leg-cat{margin-bottom:18px}
.leg-cat h3{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#1a2e4a;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #e8edf3}
.leg-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:7px}
.leg-code{flex-shrink:0;min-width:60px}
.leg-def{font-size:.82rem;color:#444;line-height:1.4}
.leg-def small{display:block;font-style:italic;color:#888;font-size:.75rem;margin-top:1px}
/* MÉTHODOLOGIE */
.meth-section{margin-bottom:20px}
.meth-section h3{font-size:1rem;font-weight:700;color:#1a2e4a;margin-bottom:8px}
.meth-section p{font-size:.88rem;line-height:1.65;color:#333;margin-bottom:8px}
.meth-section ul{margin-left:18px;margin-top:6px}
.meth-section li{font-size:.87rem;line-height:1.6;color:#333;margin-bottom:3px}
.cite-box{background:#f0f4f8;border-left:3px solid #1a2e4a;border-radius:0 6px 6px 0;padding:12px 16px;font-size:.85rem;font-family:monospace;line-height:1.6;color:#222;margin-top:8px}
.no-wrap{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>LexMouv</h1>
    <p>Base de données des dénominations d'exercices de préparation physique générale &mdash; interface linguistique</p>
  </div>
  <div class="header-btns">
    <button class="hbtn" onclick="openLeg()">&#9432; Légende</button>
    <button class="hbtn" onclick="openMeth()">&#128196; Méthodologie</button>
  </div>
</header>

<div class="container">
  <div class="search-panel">
    <h2>Recherche</h2>
    <div class="filters">
      <div class="fg" style="flex:2;min-width:220px">
        <label>Forme (recherche libre)</label>
        <input type="text" id="f-forme" class="main" placeholder="Ex : squat, développé, clean…">
      </div>
      <div class="fg">
        <label>Langue</label>
        <select id="f-langue"><option value="">Toutes</option></select>
      </div>
      <div class="fg">
        <label>Patron sémantique</label>
        <select id="f-sem"><option value="">Tous</option></select>
      </div>
      <div class="fg">
        <label>POS (fragment)</label>
        <input type="text" id="f-pos" placeholder="Ex : N ADJ, SPavec…">
      </div>
      <div class="fg">
        <label>Statut lexical</label>
        <select id="f-statut"><option value="">Tous</option></select>
      </div>
      <div class="fg">
        <label>Niveau</label>
        <select id="f-niveau"><option value="">Tous</option></select>
      </div>
      <button class="btn-reset" onclick="resetFilters()">&#10005; Réinit.</button>
    </div>
  </div>
  <div class="results-header">
    <span id="rcount"></span>
    <div class="pager">
      <button onclick="goPage(-1)" id="pprev">&#9664; Préc.</button>
      <span class="pi" id="pinfo"></span>
      <button onclick="goPage(1)" id="pnext">Suiv. &#9654;</button>
    </div>
  </div>
  <table>
    <thead><tr>
      <th>ID</th><th>Dénomination</th><th>Langue</th>
      <th>Patron POS</th><th>Patron sémantique</th><th>Segs</th><th>Statut</th><th>Niveau</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div style="margin-top:10px;display:flex;justify-content:flex-end">
    <div class="pager">
      <button onclick="goPage(-1)">&#9664; Préc.</button>
      <span class="pi" id="pinfo2"></span>
      <button onclick="goPage(1)">Suiv. &#9654;</button>
    </div>
  </div>
</div>

<!-- MODAL FICHE -->
<div class="overlay" id="ov-fiche" onclick="closeOv('ov-fiche',event)">
  <div class="modal">
    <div class="mh"><div><h2 id="m-forme"></h2><div class="mmeta" id="m-meta"></div></div><button class="mcl" onclick="closeOv('ov-fiche')">&#10005;</button></div>
    <div class="mb" id="m-body"></div>
  </div>
</div>

<!-- PANNEAU LÉGENDE -->
<div class="leg-overlay" id="ov-leg">
  <div class="leg-backdrop" onclick="closeOv('ov-leg')"></div>
  <div class="leg-panel">
    <div class="leg-header"><h2>&#9432; Légende des étiquettes</h2><button class="mcl" onclick="closeOv('ov-leg')">&#10005;</button></div>
    <div class="leg-body" id="leg-body"></div>
  </div>
</div>

<!-- MODAL MÉTHODOLOGIE -->
<div class="overlay" id="ov-meth" onclick="closeOv('ov-meth',event)">
  <div class="modal">
    <div class="mh"><div><h2>Méthodologie</h2><div class="mmeta">LexMouv &mdash; Base de données linguistique</div></div><button class="mcl" onclick="closeOv('ov-meth')">&#10005;</button></div>
    <div class="mb" id="meth-body"></div>
  </div>
</div>

const semTypeMap={ACT:"nom d'action",NPC:"nom de partie du corps",MAT:"nom de matériel",ESP:"nom d'espace / lieu",PPTE:"nom/adj. de propriété",VITESSE:"nom/adv. de vitesse",DIR:"nom/adj. de direction",TPS:"nom de temps / phase",ETHN:"ethnonyme",EPO:"éponyme"};

// ── Populate filters ──────────────────────────────────────
const sel=id=>document.getElementById(id);
RAW.langues.forEach(l=>{const o=new Option(l.nom_langue+' ('+l.code_langue+')',l.code_langue);sel('f-langue').add(o);});
RAW.patron_sem_vals.forEach(v=>{sel('f-sem').add(new Option(v,v));});
RAW.statuts.forEach(s=>{sel('f-statut').add(new Option(s.libelle+' ('+s.code_statut_lex+')',s.code_statut_lex));});
RAW.niveaux.forEach(n=>{sel('f-niveau').add(new Option(n.libelle+' ('+n.code_niveau+')',n.code_niveau));});

// ── Filtering & pagination ──────────────────────────────
let filtered=[...RAW.entries], page=1;
const PER=30;

function getF(){return{forme:sel('f-forme').value.trim().toLowerCase(),langue:sel('f-langue').value,sem:sel('f-sem').value,pos:sel('f-pos').value.trim().toLowerCase(),statut:sel('f-statut').value,niveau:sel('f-niveau').value};}

function applyF(){
  const f=getF();
  filtered=RAW.entries.filter(e=>{
    if(f.forme&&!(e.forme_vedette||''). toLowerCase().includes(f.forme))return false;
    if(f.langue&&e.langue!==f.langue)return false;
    if(f.sem&&e.patron_sem!==f.sem)return false;
    if(f.pos&&!(e.t_pos||''). toLowerCase().includes(f.pos))return false;
    if(f.statut&&e.code_statut_lex!==f.statut)return false;
    if(f.niveau&&e.code_niveau!==f.niveau)return false;
    return true;
  });
  page=1; render();
}

function resetFilters(){
  ['f-forme','f-pos'].forEach(id=>sel(id).value='');
  ['f-langue','f-sem','f-statut','f-niveau'].forEach(id=>sel(id).value='');
  applyF();
}

function goPage(d){const mp=Math.max(1,Math.ceil(filtered.length/PER));page=Math.max(1,Math.min(mp,page+d));render();}

// ── Badge helpers ───────────────────────────────────────
function badgeLang(code){const tip=(langueMap[code]||code)+(langueNote[code]?' — '+langueNote[code]:'');return'<span class="badge badge-lang" data-tip="'+tip+'">'+(langueMap[code]||code)+'</span>';}
function badgePos(v){return v?'<span class="badge badge-pos" data-tip="Patron morphosyntaxique global">'+v+'</span>':'<span style="color:#ccc">—</span>';}
function badgeSem(v){if(!v)return'<span style="color:#ccc">—</span>';const tip=v.split(' ').map(c=>semTypeMap[c]?c+' = '+semTypeMap[c]:'').filter(Boolean).join('\n');return'<span class="badge badge-sem" data-tip="'+tip+'">'+v+'</span>';}
function badgeStatut(c){if(!c)return'';const tip=statutMap[c]?c+' — '+statutMap[c]+(statutDef[c]?'\n'+statutDef[c]:''):'';return'<span class="badge badge-statut" data-tip="'+tip.replace(/"/g,"'")+'">'+ c +'</span>';}
function badgeNiveau(c){if(!c)return'';const tip=niveauMap[c]?c+' — '+niveauMap[c]+(niveauDef[c]?'\n'+niveauDef[c]:''):'';return'<span class="badge badge-niveau" data-tip="'+tip.replace(/"/g,"'")+'">'+ c +'</span>';}
function badgeSegSem(c){if(!c)return'';const tip=c+' — '+(segSemMap[c]||'')+( segSemDef[c]?'\n'+segSemDef[c]:'');return'<span class="badge badge-segsem" data-tip="'+tip.replace(/"/g,"'")+'">'+ c +'</span>';}
function badgeSegSyn(c){if(!c)return'';const tip=c+' — '+(segSynMap[c]||'')+( segSynDef[c]?'\n'+segSynDef[c]:'');return'<span class="badge badge-segsyn" data-tip="'+tip.replace(/"/g,"'")+'">'+ c +'</span>';}

// Fix badge lang helper (typo in template)
function bLang(code){const n=langueMap[code]||code;const tip=n+(langueNote[code]?' — '+langueNote[code]:'');return'<span class="badge badge-lang" data-tip="'+tip+'">'+n+'</span>';}

// ── Render table ────────────────────────────────────────
function render(){
  const tot=filtered.length;
  const mp=Math.max(1,Math.ceil(tot/PER));
  sel('rcount').textContent=tot+' dénomination'+(tot>1?'s':'')+' trouvée'+(tot>1?'s':'');
  const pi='Page '+page+' / '+mp;
  ['pinfo','pinfo2'].forEach(id=>sel(id).textContent=pi);
  sel('pprev').disabled=page<=1;
  sel('pnext').disabled=page>=mp;
  document.querySelectorAll('.pager button:first-child').forEach(b=>b.disabled=page<=1);
  document.querySelectorAll('.pager button:last-child').forEach(b=>b.disabled=page>=mp);
  const slice=filtered.slice((page-1)*PER,page*PER);
  const tb=sel('tbody');
  if(!slice.length){tb.innerHTML='<tr><td colspan="8" class="empty">Aucune dénomination ne correspond.</td></tr>';return;}
  tb.innerHTML=slice.map((e,i)=>
    '<tr onclick="showDetail('+((page-1)*PER+i)+')">'
    +'<td class="tid">'+e.id_denomination+'</td>'
    +'<td class="forme">'+e.forme_vedette+'</td>'
    +'<td>'+bLang(e.langue)+'</td>'
    +'<td>'+badgePos(e.t_pos)+'</td>'
    +'<td>'+badgeSem(e.patron_sem)+'</td>'
    +'<td style="text-align:center;color:#888">'+(e.n_segments||'')+'</td>'
    +'<td>'+badgeStatut(e.code_statut_lex)+'</td>'
    +'<td>'+badgeNiveau(e.code_niveau)+'</td>'
    +'</tr>'
  ).join('');
}

// ── Detail modal ────────────────────────────────────────
function showDetail(idx){
  const e=filtered[idx];
  sel('m-forme').textContent=e.forme_vedette;
  sel('m-meta').textContent=(langueMap[e.langue]||e.langue)+' · '+e.id_denomination;
  let h='';
  // Infos générales
  h+='<div class="sec"><h3>Informations générales</h3><div class="ig">';
  h+=ii('Langue',bLang(e.langue));
  h+=ii('Statut lexical',badgeStatut(e.code_statut_lex)||('<span style="color:#ccc">—</span>'));
  h+=ii('Niveau',badgeNiveau(e.code_niveau)||('<span style="color:#ccc">—</span>'));
  h+=ii('Patron POS',badgePos(e.t_pos));
  h+=ii('Patron sémantique',badgeSem(e.patron_sem));
  h+=ii('Patron seg. sém.',e.patron_seg_sem?('<span class="badge badge-segsem" style="font-size:.8rem">'+e.patron_seg_sem+'</span>'):'<span style="color:#ccc">—</span>');
  h+=ii('Nombre de segments',e.n_segments||'—');
  h+='</div></div>';
  // Segments
  const segs=[];
  for(let i=1;i<=6;i++){if(e['seg'+i])segs.push({n:i,forme:e['seg'+i],pos:e['pos'+i]||'',syn:e['syn'+i]||'',sem:e['sem'+i]||'',segsem:e['segsem'+i]||'',portee:e['portee'+i]||''});}
  if(segs.length){
    h+='<div class="sec"><h3>Analyse segmentale</h3><table class="seg-tbl"><thead><tr><th>#</th><th>Segment</th><th>POS</th><th>Fonc. syn.</th><th>Type sém.</th><th>Sem. seg.</th><th>Portée</th></tr></thead><tbody>';
    segs.forEach(s=>{
      h+='<tr><td><span class="snum">'+s.n+'</span></td>';
      h+='<td class="sf">'+s.forme+'</td>';
      h+='<td>'+(s.pos?'<span class="badge badge-pos" data-tip="Partie du discours">'+s.pos+'</span>':'—')+'</td>';
      h+='<td>'+badgeSegSyn(s.syn)+'</td>';
      h+='<td>'+(s.sem?'<span class="badge badge-sem" data-tip="'+(semTypeMap[s.sem]||s.sem)+'">'+s.sem+'</span>':'—')+'</td>';
      h+='<td>'+badgeSegSem(s.segsem)+'</td>';
      h+='<td>'+(s.portee||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  // Équivalents
  if(e.equivalents&&e.equivalents.length){
    h+='<div class="sec"><h3>Équivalents interlinguaux</h3><div class="tag-row">';
    e.equivalents.forEach(eq=>{h+='<span class="badge badge-lang" style="font-size:.85rem;padding:4px 10px">'+eq.forme+(eq.type?' <small>('+ eq.type+')</small>':'')+ '</span>';});
    h+='</div></div>';
  }
  // Variantes
  if(e.variantes&&e.variantes.length){
    h+='<div class="sec"><h3>Variantes</h3><div class="tag-row">';
    e.variantes.forEach(v=>{h+='<span class="badge badge-statut" style="font-size:.85rem;padding:4px 10px">'+v.forme+(v.code_type_variante?' <small>('+v.code_type_variante+')</small>':'')+ '</span>';});
    h+='</div></div>';
  }
  if(e.notes){h+='<div class="sec"><h3>Notes</h3><p style="font-size:.85rem;color:#666;font-style:italic;line-height:1.6">'+e.notes+'</p></div>';}
  sel('m-body').innerHTML=h;
  openOv('ov-fiche');
  document.querySelector('#ov-fiche .modal').scrollTop=0;
}

function ii(lbl,val){return'<div class="ii"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div></div>';}

// ── Légende panel ────────────────────────────────────────
function buildLegend(){
  const cats=[
    {title:'Types sémantiques (patron sém.)',cls:'badge-sem',items:Object.entries(semTypeMap).map(([c,l])=>({code:c,libelle:l,def:'',ex:''}))},
    {title:'Sémantique segmentale',cls:'badge-segsem',items:RAW.seg_sem.map(s=>({code:s.code_seg_sem,libelle:s.libelle,def:s.definition||'',ex:s.exemple||''}))},
    {title:'Fonctions syntaxiques',cls:'badge-segsyn',items:RAW.seg_syn.map(s=>({code:s.code_seg_syn,libelle:s.libelle,def:s.definition||'',ex:''}))},
    {title:'Statuts lexicaux',cls:'badge-statut',items:RAW.statuts.map(s=>({code:s.code_statut_lex,libelle:s.libelle,def:s.definition||'',ex:''}))},
    {title:'Niveaux de pratique',cls:'badge-niveau',items:RAW.niveaux.map(n=>({code:n.code_niveau,libelle:n.libelle,def:n.definition||'',ex:''}))},
    {title:'Langues',cls:'badge-lang',items:RAW.langues.map(l=>({code:l.code_langue,libelle:l.nom_langue,def:l.notes||'',ex:''}))},
  ];
  let h='';
  cats.forEach(cat=>{
    h+='<div class="leg-cat"><h3>'+cat.title+'</h3>';
    cat.items.forEach(it=>{
      h+='<div class="leg-item"><div class="leg-code"><span class="badge '+cat.cls+'">'+it.code+'</span></div>';
      h+='<div class="leg-def"><strong>'+it.libelle+'</strong>';
      if(it.def)h+=' — '+it.def;
      if(it.ex)h+='<small>Ex. : '+it.ex+'</small>';
      h+='</div></div>';
    });
    h+='</div>';
  });
  sel('leg-body').innerHTML=h;
}

// ── Méthodologie ─────────────────────────────────────────
function buildMeth(){
  sel('meth-body').innerHTML=`
  <div class="meth-section">
    <h3>Cadre théorique</h3>
    <p>LexMouv s'inscrit dans le cadre de la sémantique lexicale et de la terminologie linguistique. L'analyse des dénominations repose sur une approche compositionnelle qui distingue, au sein de chaque unité lexicale, les segments porteurs de valeur sémantique distincte.</p>
    <p>La classification sémantique des segments nominaux s'appuie sur la taxinomie ontologique proposée par <strong>Flaux &amp; Van de Velde (2000)</strong>, adaptée aux spécificités du lexique sportif : noms d'action (ACT), noms de partie du corps (NPC), noms de matériel (MAT), noms d'espace (ESP), noms de propriété (PPTE), de direction (DIR), de temps (TPS), de vitesse (VITESSE), ethnonymes (ETHN) et éponymes (EPO).</p>
    <p>Le champ d'investigation couvre les dénominations d'exercices de préparation physique générale (PPG) et de fitness, dans plusieurs langues (français, anglais, bulgare, allemand, latin, grec ancien, formes hybrides), à différents niveaux de pratique (initiation, intermédiaire, confirmé, haut niveau).</p>
  </div>
  <div class="meth-section">
    <h3>Procédure d'analyse segmentale</h3>
    <p>Chaque dénomination est découpée en <strong>segments</strong>, définis comme des unités syntaxiquement cohérentes (nom, syntagme prépositionnel, adjectif, etc.) auxquelles est associée une valeur sémantique au sein de la dénomination.</p>
    <p>Pour chaque segment sont renseignés :</p>
    <ul>
      <li><strong>La forme</strong> : la réalisation graphique du segment dans la dénomination</li>
      <li><strong>Le POS</strong> : la catégorie morphosyntaxique (N, ADJ, SPavec_N, NOUN NOUN…)</li>
      <li><strong>La fonction syntaxique</strong> : rôle du segment dans la structure (TETE, MOD_ANT, MOD_POST, COMPL, COORD, APP)</li>
      <li><strong>Le type sémantique</strong> : valeur ontologique du noyau (ACT, NPC, MAT, ESP, PPTE…)</li>
      <li><strong>La sémantique segmentale</strong> : rôle fonctionnel du segment dans la dénomination (MOUV, CIBLE, CHARGE, LOC, MAN, LAT, AMP, TECH, TMP, BUT)</li>
      <li><strong>La portée</strong> : étendue de la référence du segment dans la dénomination</li>
    </ul>
  </div>
  <div class="meth-section">
    <h3>Comment citer cette base</h3>
    <p>Pour toute référence à LexMouv dans une publication scientifique :</p>
    <div class="cite-box">ALEKSANDROVA, Angelina (2026). <em>LexMouv. Base de données linguistique des dénominations d'exercices de préparation physique générale</em>. Université Paris Cité / Laboratoire EDA (EA 4071). [En ligne] https://sportlanguagelab.github.io/lexmouv/lexmouv_interface.html</div>
    <p style="margin-top:10px;font-size:.82rem;color:#888">⚠️ La base étant en cours de constitution, merci d'indiquer la date de consultation.</p>
  </div>`;
}

// ── Overlay management ────────────────────────────────────
function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id,e){if(!e||e.target===document.getElementById(id))document.getElementById(id).classList.remove('open');}
function openLeg(){buildLegend();openOv('ov-leg');}
function openMeth(){buildMeth();openOv('ov-meth');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')['ov-fiche','ov-leg','ov-meth'].forEach(id=>document.getElementById(id).classList.remove('open'));});

// ── Events ────────────────────────────────────────────────
['f-forme','f-pos'].forEach(id=>sel(id).addEventListener('input',applyF));
['f-langue','f-sem','f-statut','f-niveau'].forEach(id=>sel(id).addEventListener('change',applyF));

applyF();
</script>
</body>
</html>
